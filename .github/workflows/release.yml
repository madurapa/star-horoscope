# Tagged builds (v*) compile modern_star on Linux/macOS/Windows, run the
# full gate (ctest + --verify), and publish the three binaries as a
# GitHub Release. Windows uses MSVC (VS2022 x64); POSIX bits are
# _WIN32-guarded with MSVC shims in src/Compat.hpp (always _MSC_VER).
# All builds are 64-bit (enforced in CMakeLists). See docs/plans.md
# Appendix A (release tags).
name: release

on:
  push:
    branches: ["main"]  # CI builds only; releases fire on tags (see below)
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: star_linux
            exe: modern_star
          - os: macos-latest
            binary: star.dmg
            exe: modern_star
          - os: windows-latest
            binary: star.exe
            exe: modern_star.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTAR_PORTABLE=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build (POSIX)
        if: runner.os != 'Windows'
        run: cmake --build build

      - name: Gate — ctest + --verify (POSIX)
        if: runner.os != 'Windows'
        run: |
          ctest --test-dir build --output-on-failure
          ./build/modern_star --verify

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DSTAR_PORTABLE=ON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Gate (Windows)
        if: runner.os == 'Windows'
        run: |
          ctest --test-dir build -C Release --output-on-failure
          .\build\Release\modern_star.exe --verify

      - name: Stage binary (Linux)
        if: runner.os == 'Linux'
        run: cp "build/${{ matrix.exe }}" "${{ matrix.binary }}"

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-root
          cp "build/${{ matrix.exe }}" dmg-root/star
          strip -x dmg-root/star || strip dmg-root/star
          ln -s /Applications dmg-root/
          hdiutil create -volname "Modern STAR" -srcfolder dmg-root \
            -ov -format UDZO "${{ matrix.binary }}"
          rm -rf dmg-root

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: cmake -E copy "build/Release/${{ matrix.exe }}" "${{ matrix.binary }}"

      - name: Strip release binary (Linux)
        if: runner.os == 'Linux'
        # The static build bundles glibc+libstdc++; symbols are ~15%
        # of it with no runtime value. MSVC already separates debug
        # info (.pdb, not uploaded); macOS is stripped pre-dmg above.
        run: strip "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  # Frozen single-file report app (console + pystar engine, PyInstaller
  # one-file per console/freeze.spec). Linux pins 22.04 so the glibc
  # floor stays low for old distros; the C++ static binary above does
  # not care. Artifacts join the GitHub Release via dist/ below.
  freeze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: star-report-linux
            exe: dist/star-report
          - os: macos-latest
            artifact: star-report-macos
            exe: dist/star-report
          - os: windows-latest
            artifact: star-report-windows.exe
            exe: dist/star-report.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install freeze deps
        shell: bash
        run: python -m pip install nanobind pyinstaller rich typer

      - name: Build pystar
        shell: bash
        run: |
          PYEXE="$(python -c 'import sys; print(sys.executable)')"
          cmake -S . -B pybuild -DSTAR_PYTHON=ON -DPython_EXECUTABLE="$PYEXE"
          cmake --build pybuild --target pystar

      - name: Freeze
        shell: bash
        run: |
          STAR_PYBUILD=pybuild python -m PyInstaller console/freeze.spec \
            --distpath dist --workpath freeze-build --noconfirm
          mv "${{ matrix.exe }}" "dist/${{ matrix.artifact }}"

      - name: Smoke-test frozen binary
        shell: bash
        run: |
          BIN="dist/${{ matrix.artifact }}"
          test "${{ runner.os }}" = "Windows" || chmod +x "$BIN"
          "$BIN" --help
          "$BIN" --name "Test User" --year 2000 --month 8 --day 17 \
            --hour 14 --minute 5 --city 7 --export-html smoke.html
          test -s smoke.html

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$(ls -A dist)" || { echo "No assets in dist/"; exit 1; }
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "${{ github.ref_name }}" \
              --notes "Automated build of ${{ github.ref_name }} (see CHANGELOG.md). Linux (static binary), macOS (.dmg drag-to-Applications), Windows (MSVC exe, static CRT) — download and run, no install. star-report-* are the single-file horoscope app (terminal + self-contained HTML reports, no Python needed). Unsigned builds: macOS right-click > Open once; Windows SmartScreen > Run anyway."
          fi
